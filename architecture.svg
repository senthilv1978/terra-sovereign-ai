<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" fill="none">
  <rect width="1440" height="760" rx="28" fill="#F6F4ED"/>
  <text x="72" y="84" fill="#14251F" font-family="Arial,sans-serif" font-size="31" font-weight="700">A sovereignty spectrum, built around country control</text>
  <text x="72" y="122" fill="#62716A" font-family="Arial,sans-serif" font-size="17">Raw records stay local. Approved learning signals travel with consent. Open knowledge can flow globally.</text>
  <rect x="72" y="168" width="548" height="502" rx="22" fill="#E5EEE6" stroke="#B9CCBD" stroke-width="2"/>
  <text x="104" y="215" fill="#23513E" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="2">01 / COUNTRY</text>
  <text x="104" y="254" fill="#14251F" font-family="Arial,sans-serif" font-size="25" font-weight="700">National AI node</text>
  <rect x="104" y="290" width="218" height="86" rx="13" fill="#fff"/><text x="124" y="324" fill="#14251F" font-family="Arial,sans-serif" font-size="17" font-weight="700">Sensitive records</text><text x="124" y="351" fill="#62716A" font-family="Arial,sans-serif" font-size="14">Farm + household data</text>
  <rect x="365" y="290" width="218" height="86" rx="13" fill="#fff"/><text x="385" y="324" fill="#14251F" font-family="Arial,sans-serif" font-size="17" font-weight="700">Local policy gate</text><text x="385" y="351" fill="#62716A" font-family="Arial,sans-serif" font-size="14">Keys · purpose · audit</text>
  <path d="M322 333h43" stroke="#527E63" stroke-width="3"/><path d="m357 326 9 7-9 7" stroke="#527E63" stroke-width="3"/>
  <rect x="104" y="425" width="218" height="103" rx="13" fill="#23513E"/><text x="124" y="462" fill="#fff" font-family="Arial,sans-serif" font-size="17" font-weight="700">National model</text><text x="124" y="491" fill="#DDE9DF" font-family="Arial,sans-serif" font-size="14">Train + infer in-country</text>
  <rect x="365" y="425" width="218" height="103" rx="13" fill="#D5E5D9"/><text x="385" y="462" fill="#14251F" font-family="Arial,sans-serif" font-size="17" font-weight="700">Advisory agent</text><text x="385" y="491" fill="#52675B" font-family="Arial,sans-serif" font-size="14">Local experts decide</text>
  <path d="M322 476h43" stroke="#527E63" stroke-width="3"/><path d="m357 469 9 7-9 7" stroke="#527E63" stroke-width="3"/>
  <text x="104" y="590" fill="#23513E" font-family="Arial,sans-serif" font-size="14" font-weight="700">RAW DATA DOES NOT LEAVE BY DEFAULT</text>
  <rect x="660" y="168" width="324" height="502" rx="22" fill="#F3E8D7" stroke="#DFCCAC" stroke-width="2"/>
  <text x="692" y="215" fill="#8E622D" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="2">02 / REGION</text>
  <text x="692" y="254" fill="#14251F" font-family="Arial,sans-serif" font-size="25" font-weight="700">Learning circle</text>
  <circle cx="822" cy="374" r="72" fill="#fff"/><text x="782" y="369" fill="#14251F" font-family="Arial,sans-serif" font-size="18" font-weight="700">Secure</text><text x="778" y="396" fill="#62716A" font-family="Arial,sans-serif" font-size="15">aggregation</text>
  <rect x="692" y="487" width="260" height="74" rx="13" fill="#E8D4B7"/><text x="716" y="518" fill="#3D3325" font-family="Arial,sans-serif" font-size="16" font-weight="700">Opt-in updates</text><text x="716" y="542" fill="#786347" font-family="Arial,sans-serif" font-size="14">screened · bounded · revocable</text>
  <text x="692" y="614" fill="#8E622D" font-family="Arial,sans-serif" font-size="14" font-weight="700">COUNTRIES APPROVE EACH ROUND</text>
  <rect x="1024" y="168" width="344" height="502" rx="22" fill="#E4EBEF" stroke="#C1D0D9" stroke-width="2"/>
  <text x="1056" y="215" fill="#466474" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="2">03 / GLOBAL</text>
  <text x="1056" y="254" fill="#14251F" font-family="Arial,sans-serif" font-size="25" font-weight="700">Open commons</text>
  <rect x="1056" y="303" width="280" height="78" rx="13" fill="#fff"/><text x="1080" y="337" fill="#14251F" font-family="Arial,sans-serif" font-size="17" font-weight="700">Open weather data</text><text x="1080" y="361" fill="#62716A" font-family="Arial,sans-serif" font-size="14">Public, licensed sources</text>
  <rect x="1056" y="403" width="280" height="78" rx="13" fill="#fff"/><text x="1080" y="437" fill="#14251F" font-family="Arial,sans-serif" font-size="17" font-weight="700">Shared baseline</text><text x="1080" y="461" fill="#62716A" font-family="Arial,sans-serif" font-size="14">Portable model artifacts</text>
  <text x="1056" y="545" fill="#466474" font-family="Arial,sans-serif" font-size="14" font-weight="700">EVALUATE BEFORE ADOPTION</text>
  <path d="M620 475h40" stroke="#A4753D" stroke-width="3" stroke-dasharray="6 6"/><path d="m652 468 9 7-9 7" stroke="#A4753D" stroke-width="3"/>
  <path d="M984 475h40" stroke="#607C8A" stroke-width="3"/><path d="m1016 468 9 7-9 7" stroke="#607C8A" stroke-width="3"/>
  <text x="72" y="718" fill="#62716A" font-family="Arial,sans-serif" font-size="14">Controls shown are design patterns, not guarantees. Updates and aggregates can still leak information.</text>
</svg>
